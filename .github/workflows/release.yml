name: Release

# Pushing a tag vX.Y.Z (script/release makes it) tests, builds and
# publishes the release: the zipped app and the notes from the CHANGELOG.

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    env:
      # the oldest macOS the app runs on (LSMinimumSystemVersion)
      MACOSX_DEPLOYMENT_TARGET: "14.0"
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ruby
          bundler-cache: false

      - name: The tag matches the version in Info.plist
        run: |
          version=${GITHUB_REF_NAME#v}
          bundled=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" config/Info.plist)
          if [ "$version" != "$bundled" ]; then
            echo "tag $GITHUB_REF_NAME, but Info.plist says $bundled" >&2
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Run the Minitest suite
        run: script/test
      - uses: ./.github/actions/setup-spinel
      - name: Check for calls Spinel could not resolve
        run: script/static_raise_check
      - name: Build the app
        run: script/build
      - name: Export a synthetic take
        run: script/render_check

      - name: Zip the app and write the notes
        run: |
          mkdir -p build/release
          ditto -c -k --keepParent "build/Spinel Studio.app" "build/release/Spinel-Studio-$VERSION-arm64.zip"
          script/release_notes "$VERSION" > build/release/notes.md

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "Spinel Studio $VERSION" \
            --notes-file build/release/notes.md "build/release/Spinel-Studio-$VERSION-arm64.zip"
