name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ruby
          bundler-cache: false
      - name: Run the Minitest suite
        run: script/test

  # CRuby passing does not mean Spinel compiles it: this builds the app
  # with the pinned Spinel and exports a take with the binary.
  build:
    runs-on: macos-15
    env:
      # the oldest macOS the app runs on (LSMinimumSystemVersion)
      MACOSX_DEPLOYMENT_TARGET: "14.0"
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ruby
          bundler-cache: false
      - uses: ./.github/actions/setup-spinel
      - name: Check for calls Spinel could not resolve
        run: script/static_raise_check
      - name: Build the app
        run: script/build
      - name: Export a synthetic take
        run: script/render_check
      - uses: actions/upload-artifact@v4
        with:
          name: Spinel-Studio-${{ github.sha }}
          path: build/Spinel Studio.app
          retention-days: 7
